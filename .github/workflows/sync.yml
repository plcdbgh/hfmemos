name: Sync Memos to GHCR

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest Memos image
        run: docker pull neosmemo/memos:stable

      - name: Tag and push to GHCR
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/memos:latest"
          docker tag neosmemo/memos:stable $IMAGE
          docker push $IMAGE
